<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 240" width="980" height="240">
  <rect width="980" height="240" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="979" height="239" rx="15.5" fill="none" stroke="#e6e6e6"/>
  <text x="40" y="44" font-family="-apple-system,Segoe UI,sans-serif" font-size="15" fill="#6b6b6b">From autonomous conjecture to theorem candidate — every step with evidence</text>
  <g font-family="-apple-system,Segoe UI,sans-serif" font-size="12.5">
    <rect x="30" y="70" width="150" height="86" rx="10" fill="#f7f7f5" stroke="#e6e6e6"/>
    <text x="105" y="100" text-anchor="middle" fill="#0d0d0d" font-size="13.5">Blind conjecture</text>
    <text x="105" y="118" text-anchor="middle" fill="#0d0d0d" font-size="13.5">bank</text>
    <text x="105" y="142" text-anchor="middle" fill="#0b6b3a" font-family="ui-monospace,monospace">T4: 68/68</text>

    <rect x="205" y="70" width="150" height="86" rx="10" fill="#f7f7f5" stroke="#e6e6e6"/>
    <text x="280" y="100" text-anchor="middle" fill="#0d0d0d" font-size="13.5">Massive</text>
    <text x="280" y="118" text-anchor="middle" fill="#0d0d0d" font-size="13.5">verification</text>
    <text x="280" y="142" text-anchor="middle" fill="#0b6b3a" font-family="ui-monospace,monospace">2,131,019</text>

    <rect x="380" y="70" width="150" height="86" rx="10" fill="#f7f7f5" stroke="#e6e6e6"/>
    <text x="455" y="100" text-anchor="middle" fill="#0d0d0d" font-size="13.5">Written</text>
    <text x="455" y="118" text-anchor="middle" fill="#0d0d0d" font-size="13.5">proof</text>
    <text x="455" y="142" text-anchor="middle" fill="#0b6b3a" font-family="ui-monospace,monospace">EXP-086</text>

    <rect x="555" y="70" width="150" height="86" rx="10" fill="#f7f7f5" stroke="#e6e6e6"/>
    <text x="630" y="100" text-anchor="middle" fill="#0d0d0d" font-size="13.5">Count axis</text>
    <text x="630" y="118" text-anchor="middle" fill="#0d0d0d" font-size="13.5">17 f × 2 ι</text>
    <text x="630" y="142" text-anchor="middle" fill="#0b6b3a" font-family="ui-monospace,monospace">34/34</text>

    <rect x="730" y="70" width="105" height="86" rx="10" fill="#f7f7f5" stroke="#e6e6e6"/>
    <text x="782" y="100" text-anchor="middle" fill="#0d0d0d" font-size="13.5">Law</text>
    <text x="782" y="118" text-anchor="middle" fill="#0d0d0d" font-size="13.5">f(1)≠f(2)</text>
    <text x="782" y="142" text-anchor="middle" fill="#0b6b3a" font-family="ui-monospace,monospace">102/102</text>

    <rect x="855" y="70" width="105" height="86" rx="10" fill="#0b6b3a" stroke="#0b6b3a"/>
    <text x="907" y="100" text-anchor="middle" fill="#ffffff" font-size="13.5">Character.</text>
    <text x="907" y="118" text-anchor="middle" fill="#ffffff" font-size="13.5">Sₙ·K</text>
    <text x="907" y="142" text-anchor="middle" fill="#c8e8d6" font-family="ui-monospace,monospace">96 exact</text>

    <g stroke="#c9c9c9" stroke-width="2" marker-end="url(#a2)">
      <line x1="180" y1="113" x2="203" y2="113"/><line x1="355" y1="113" x2="378" y2="113"/>
      <line x1="530" y1="113" x2="553" y2="113"/><line x1="705" y1="113" x2="728" y2="113"/>
      <line x1="835" y1="113" x2="853" y2="113"/>
    </g>
    <defs><marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c9c9c9"/></marker></defs>
    <text x="490" y="200" text-anchor="middle" fill="#6b6b6b" font-size="12.5">then: universes (Z₃ · random · k-WL) — where T4 survives, where it dies, and the type of theorem it becomes</text>
  </g>
</svg>
