  <line x1="20" y1="130" x2="340" y2="130" stroke="#0b6b3a" stroke-width="2"/>
  <text x="180" y="152" text-anchor="middle" font-size="13" fill="#0b6b3a" font-family="-apple-system,sans-serif">hold for every f</text>
  <line x1="360" y1="130" x2="700" y2="130" stroke="#26557a" stroke-width="2"/>
  <text x="530" y="152" text-anchor="middle" font-size="13" fill="#26557a" font-family="-apple-system,sans-serif">hold ⟺ f(1) ≠ f(2)</text>
  <text x="360" y="196" font-size="13.5" fill="#6b6b6b" font-family="-apple-system,sans-serif">Uniformity binds the two halves: outside K, everything dies (even if it preserves the pair).</text>
