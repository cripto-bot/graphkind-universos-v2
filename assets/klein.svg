    <text x="265" y="78" text-anchor="middle" fill="#6b6b6b" font-size="11">swap yes · comp no</text>
    <rect x="360" y="30" width="150" height="64" rx="12" fill="#f7f7f5" stroke="#e6e6e6"/>
    <text x="435" y="58" text-anchor="middle" fill="#0d0d0d">comp_dir</text>
    <text x="435" y="78" text-anchor="middle" fill="#6b6b6b" font-size="11">swap no · comp yes</text>
    <rect x="530" y="30" width="170" height="64" rx="12" fill="#f7f7f5" stroke="#e6e6e6"/>
