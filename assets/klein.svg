    <rect x="20" y="30" width="150" height="64" rx="12" fill="#f7f7f5" stroke="#e6e6e6"/>
    <text x="95" y="58" text-anchor="middle" fill="#0d0d0d">id</text>
    <text x="95" y="78" text-anchor="middle" fill="#6b6b6b" font-size="11">swap no · comp no</text>
