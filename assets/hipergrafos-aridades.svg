<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470">
  <rect width="820" height="470" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="819" height="469" rx="15.5" fill="none" stroke="#e6e6e6"/>
  <text x="36" y="46" font-family="DejaVu Serif, Georgia, serif" font-size="22" fill="#0d0d0d">Hypergraphs: the map predicts, and the arity transplant fails</text>
  <text x="36" y="84" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#0d0d0d" text-anchor="start">E ⊆ C(V,k)   ·   E^c = C(V,k) ∖ E   ·   M'(v) = T_v − M(v)  (injective) ⟹ T4 lives</text>
  <text x="36" y="108" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#6b6b6b" text-anchor="start">prediction registered before measuring (3-uniform hypergraphs)</text>
  <rect x="36" y="130" width="360" height="120" rx="12" fill="none" stroke="#e6e6e6"/>
  <text x="52" y="158" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#6b6b6b" text-anchor="start">PREDICTED</text>
  <text x="52" y="186" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#0b6b3a" text-anchor="start">T4 lives</text>
  <text x="52" y="214" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#6b6b6b" text-anchor="start">MEASURED</text>
  <text x="52" y="240" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#0b6b3a" text-anchor="start">1831/1831  (n≤5 + sample n=6)</text>
  <rect x="420" y="130" width="364" height="120" rx="12" fill="none" stroke="#e6e6e6"/>
  <text x="436" y="158" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#0d0d0d" text-anchor="start">ARITY LADDER — T4 lives</text>
  <text x="452" y="190" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#6b6b6b" text-anchor="start">k=3</text>
  <text x="452" y="214" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#0b6b3a" text-anchor="start">34/34</text>
  <rect x="452" y="226" width="86" height="8" rx="4" fill="#0b6b3a"/>
  <text x="562" y="190" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#6b6b6b" text-anchor="start">k=4</text>
  <text x="562" y="214" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#0b6b3a" text-anchor="start">156/156</text>
  <rect x="562" y="226" width="86" height="8" rx="4" fill="#0b6b3a"/>
  <text x="672" y="190" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#6b6b6b" text-anchor="start">k=5</text>
  <text x="672" y="214" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#0b6b3a" text-anchor="start">7/7</text>
  <rect x="672" y="226" width="86" height="8" rx="4" fill="#0b6b3a"/>
  <text x="36" y="292" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#a33" text-anchor="start">MIXED ARITIES {2,3}: the channel-law transplant FAILS</text>
  <text x="36" y="320" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#0b6b3a" text-anchor="start">total complement: T4 lives 100%</text>
  <text x="36" y="346" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#a33" text-anchor="start">per-arity complement: ALSO lives 1038/1038 (both variants)</text>
  <text x="36" y="378" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#6b6b6b" text-anchor="start">mechanism: per-arity messages have different types (single colors vs pairs) —</text>
  <text x="36" y="398" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#6b6b6b" text-anchor="start">the refinement repairs the round-0 degree-multiset fusion (261 000 cases, 0 witnesses)</text>
  <text x="36" y="436" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#0d0d0d" text-anchor="start">the law is of CHANNELS, not of every decomposition</text>
</svg>
