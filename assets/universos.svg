<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <rect width="900" height="300" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="299" rx="15.5" fill="none" stroke="#e6e6e6"/>
  <text x="40" y="44" font-family="-apple-system,Segoe UI,sans-serif" font-size="15" fill="#6b6b6b">The invariant changes type — and T4 changes mathematical category</text>

  <!-- 1: standard -->
  <rect x="40" y="70" width="190" height="170" rx="12" fill="#f7f7f5" stroke="#e6e6e6"/>
  <text x="135" y="100" text-anchor="middle" font-family="DejaVu Serif, Georgia, serif" font-size="18" fill="#0d0d0d">Standard</text>
  <text x="135" y="122" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#6b6b6b">partition</text>
  <g fill="#26557a"><rect x="75" y="140" width="14" height="14" rx="3"/><rect x="93" y="140" width="14" height="14" rx="3"/><rect x="111" y="140" width="14" height="14" rx="3"/></g>
  <g fill="#9a7b1f"><rect x="140" y="140" width="14" height="14" rx="3"/><rect x="158" y="140" width="14" height="14" rx="3"/></g>
  <circle cx="90" cy="180" r="10" fill="#a33"/>
  <text x="135" y="222" text-anchor="middle" font-size="13" fill="#0b6b3a" font-family="DejaVu Sans, sans-serif">✓ holds (proved)</text>

  <!-- 2: Z3 -->
  <rect x="250" y="70" width="190" height="170" rx="12" fill="#f7f7f5" stroke="#e6e6e6"/>
  <text x="345" y="100" text-anchor="middle" font-family="DejaVu Serif, Georgia, serif" font-size="18" fill="#0d0d0d">Z₃ deterministic</text>
  <text x="345" y="122" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#6b6b6b">orbit (periods)</text>
  <circle cx="345" cy="158" r="20" fill="none" stroke="#26557a" stroke-width="2"/>
  <path d="M 345 138 a 20 20 0 1 1 -14 34" fill="none" stroke="#a33" stroke-width="2" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a33"/></marker></defs>
  <text x="345" y="222" text-anchor="middle" font-size="13" fill="#a33" font-family="DejaVu Sans, sans-serif">✗ dies (max 52.4%)</text>

  <!-- 3: random -->
  <rect x="460" y="70" width="190" height="170" rx="12" fill="#f7f7f5" stroke="#e6e6e6"/>
  <text x="555" y="100" text-anchor="middle" font-family="DejaVu Serif, Georgia, serif" font-size="18" fill="#0d0d0d">Random</text>
  <text x="555" y="122" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#6b6b6b">distribution</text>
  <g fill="#26557a"><rect x="500" y="170" width="12" height="10"/><rect x="516" y="160" width="12" height="20"/><rect x="532" y="148" width="12" height="32"/><rect x="548" y="158" width="12" height="22"/><rect x="564" y="166" width="12" height="14"/><rect x="580" y="172" width="12" height="8"/></g>
  <text x="555" y="222" text-anchor="middle" font-size="13" fill="#a33" font-family="DejaVu Sans, sans-serif">✗ process (18.6%)</text>
  <text x="555" y="240" text-anchor="middle" font-size="12" fill="#0b6b3a" font-family="DejaVu Sans, sans-serif">✓ object (almost surely)</text>

  <!-- 4: k-WL -->
  <rect x="670" y="70" width="190" height="170" rx="12" fill="#f7f7f5" stroke="#e6e6e6"/>
  <text x="765" y="100" text-anchor="middle" font-family="DejaVu Serif, Georgia, serif" font-size="18" fill="#0d0d0d">k-FWL hierarchy (≡ (k+1)-WL)</text>
  <text x="765" y="122" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#6b6b6b">stronger observers</text>
  <g stroke="#26557a" stroke-width="2" fill="none">
    <rect x="720" y="180" width="90" height="12" rx="3"/>
    <rect x="732" y="162" width="66" height="12" rx="3"/>
    <rect x="744" y="144" width="42" height="12" rx="3"/>
  </g>
  <text x="765" y="222" text-anchor="middle" font-size="13" fill="#0b6b3a" font-family="DejaVu Sans, sans-serif">✓ T4_k 51/51</text>
  <text x="765" y="240" text-anchor="middle" font-size="12" fill="#6b6b6b" font-family="DejaVu Sans, sans-serif">cascade 26 → 0</text>
</svg>
